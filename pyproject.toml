[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grapecount"
version = "1.0.0"
description = "Multi-view berry counting for grape bunches: benchmark, counting-fidelity diagnostic, and method"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=1.26,<2",
    "scipy>=1.15",
    "PyYAML>=6.0",
    "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
